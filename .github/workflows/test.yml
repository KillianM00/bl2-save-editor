name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Clone borderlands2-tool
        run: |
          git clone https://github.com/apocalyptech/borderlands2.git borderlands2-tool

      - name: Create minimal config
        run: |
          echo '{"borderlands2_tool_dir": "borderlands2-tool", "save_dir": "/tmp", "gibbed_dir": "/tmp", "game_dir": "/tmp"}' > config.json

      - name: Run tests
        run: python -m pytest tests/ -v
